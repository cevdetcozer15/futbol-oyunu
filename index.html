<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Kesişim: Futbol Online</title>
    <link rel="stylesheet" href="style.css?v=6">
    <style>
        .custom-team-box { background: #34495e; padding: 15px; border-radius: 8px; margin: 15px 0; text-align: center; }
        .input-group { display: flex; justify-content: center; gap: 5px; margin-bottom: 10px; }
        .input-group input { flex: 1; padding: 10px; border-radius: 5px; border: none; font-size: 16px; }
        .mic-btn { background: #e74c3c; color: white; border: none; border-radius: 50%; width: 40px; height: 40px; cursor: pointer; font-size: 18px; display: flex; align-items: center; justify-content: center; transition: 0.3s;}
        .mic-btn:hover { background: #c0392b; transform: scale(1.1); }
        .mic-btn.listening { animation: pulse 1s infinite; background: #2ecc71; }
        @keyframes pulse { 0% { box-shadow: 0 0 0 0 rgba(46, 204, 113, 0.7); } 70% { box-shadow: 0 0 0 10px rgba(46, 204, 113, 0); } 100% { box-shadow: 0 0 0 0 rgba(46, 204, 113, 0); } }
    </style>
</head>
<body>
    <!-- Lobi Ekranı -->
    <div id="lobby" class="screen active">
        <h1>Ortak Futbolcuyu Bul!</h1>
        <input type="text" id="playerName" placeholder="Adını Yaz (Max 12 Harf)" maxlength="12">

        <div class="lobby-actions">
            <button id="singlePlayerBtn">Tek Oyuncu (Süreli)</button>
            <button id="createRoomBtn">Oda Kur (Çoklu)</button>
            
            <div class="join-section">
                <input type="text" id="roomCodeInput" placeholder="Oda Kodu Gir">
                <button id="joinRoomBtn">Katıl</button>
            </div>
        </div>

        <div id="play-style-selection" style="display: none;" class="mode-container">
            <h3>Oyun Tarzını Seç</h3>
            <button id="styleRandomBtn" class="mode-btn">🎲 Rastgele (Sistem Seçer)</button>
            <button id="styleCustomBtn" class="mode-btn" style="background-color: #9b59b6;">🎤 Takım Seç</button>
            <button id="cancelStyleBtn" class="cancel-btn" style="margin-top: 10px;">❌ İptal</button>
        </div>

        <div id="mode-selection" style="display: none;" class="mode-container">
            <h3>Oyun Modunu Seç</h3>
            <button id="modeTeamsBtn" class="mode-btn">🌍 Normal Oyun (Klasik)</button>
            <button id="modeSuperLigBtn" class="mode-btn" style="background-color: #e74c3c;">🇹🇷 Süper Lig Modu</button>
            <button id="modeCountryBtn" class="mode-btn" style="background-color: #3498db;">🗺️ Takım - Ülke</button>
            <button id="backModeBtn" class="cancel-btn" style="margin-top: 10px;">⬅️ Geri</button>
        </div>

        <!-- YENİ: ZORLUK SEÇİM EKRANI -->
        <div id="difficulty-selection" style="display: none;" class="mode-container">
            <h3>Zorluk Seviyesi (Klasik Mod)</h3>
            <button id="diffEasyBtn" class="mode-btn" style="background-color: #2ecc71;">🟢 Kolay (Sadece Büyük Takımlar)</button>
            <button id="diffMediumBtn" class="mode-btn" style="background-color: #f1c40f; color: black;">🟡 Orta (En Az 1 Büyük Takım)</button>
            <button id="diffHardBtn" class="mode-btn" style="background-color: #e67e22;">🟠 Zor (Tamamen Rastgele)</button>
            <button id="diffVeryHardBtn" class="mode-btn" style="background-color: #e74c3c;">🔴 Çok Zor (Büyük Takım Yok)</button>
            <button id="backDiffBtn" class="cancel-btn" style="margin-top: 10px;">⬅️ Geri</button>
        </div>

        <div id="lobby-message"></div>
    </div>

    <!-- Bekleme Ekranı -->
    <div id="waiting" class="screen">
        <h2>Oda Kuruldu!</h2>
        <p>Rakibinin girmesi gereken kod:</p>
        <div class="room-code-display" id="displayRoomCode">---</div>
        <p>Bekleniyor...</p>
        <div class="game-controls"><button id="waiting-exit-btn">🚪 Çıkış</button></div>
    </div>

    <!-- Oyun Ekranı -->
    <div id="game" class="screen">
        <div id="leaderboard-container" style="display: none;">
            <h3>🏆 Top 5 Skorer</h3>
            <ul id="leaderboard-list"><li>Yükleniyor...</li></ul>
        </div>

        <div class="scoreboard">
            <div class="player-score" id="p1-score-container"><span id="p1-name">Oyuncu 1</span>: <span id="p1-score">0</span></div>
            <div class="player-score" id="p2-score-container"><span id="p2-name">Oyuncu 2</span>: <span id="p2-score">0</span></div>
        </div>

        <div id="status-message">Hazır olun...</div>

        <!-- Takım Belirleme Alanı -->
        <div id="team-selection-area" class="custom-team-box" style="display: none;">
            <h3 style="color: #f1c40f; margin-bottom: 5px;">Takım Seç</h3>
            <p style="font-size: 12px; margin-bottom: 15px;">Takımı yaz veya mikrofonla söyle!</p>
            
            <div class="input-group" id="team-a-group">
                <input type="text" id="custom-team-a" placeholder="1. Takım (Sen Seç)">
                <button class="mic-btn" id="mic-a" title="Sesli Söyle">🎤</button>
            </div>
            <div class="input-group" id="team-b-group">
                <input type="text" id="custom-team-b" placeholder="2. Takım">
                <button class="mic-btn" id="mic-b" title="Sesli Söyle">🎤</button>
            </div>
            
            <button id="confirm-teams-btn" class="mode-btn" style="background-color: #2ecc71; margin-top: 10px; width: 100%;">Takımı Onayla & Hazır Ol</button>
            <div id="custom-team-error" style="color: #e74c3c; margin-top: 10px; font-weight: bold;"></div>
        </div>

        <div id="timer-display" style="display: none;">30</div>

        <div class="teams-container" id="match-teams-container" style="display: none;">
            <div class="team-box" id="teamA-box">?</div>
            <div class="team-box" id="teamB-box">?</div>
        </div>

       <div class="action-area" id="action-area" style="display:none;">
            <input type="text" id="answer-input" placeholder="Futbolcu adını yaz...">
            <button id="submit-answer-btn">Gönder (Enter)</button>
            <button id="passButton">Pas Geç ⏭️</button>
        </div>

        <div class="game-controls">
            <button id="new-game-btn">🔄 Yeni Oyun</button>
            <button id="exit-btn">🚪 Çıkış</button>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/canvas-confetti@1.9.3/dist/confetti.browser.min.js"></script>
    <script src="/socket.io/socket.io.js"></script>
    <script src="app.js?v=20"></script>
</body>
</html>
